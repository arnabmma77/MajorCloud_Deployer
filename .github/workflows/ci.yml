name: Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  AWS_DEFAULT_REGION: us-east-1
  ECR_REPOSITORY: weather-app
  IMAGE_TAG: ${{ github.sha }}

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        cd app/backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 pytest pytest-cov

    - name: Lint with flake8
      run: |
        cd app/backend
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Test with pytest
      run: |
        cd app/backend
        # Create a simple test file if it doesn't exist
        mkdir -p tests
        cat > tests/test_app.py << 'EOF'
        import sys
        import os
        sys.path.append(os.path.dirname(os.path.dirname(os.path.abspath(__file__))))
        
        import pytest
        from app import app
        
        @pytest.fixture
        def client():
            app.config['TESTING'] = True
            with app.test_client() as client:
                yield client
        
        def test_health_endpoint(client):
            """Test the health endpoint returns 200"""
            rv = client.get('/health')
            assert rv.status_code == 200
            data = rv.get_json()
            assert data['status'] == 'healthy'
            assert 'message' in data
        
        def test_weather_endpoint_no_city(client):
            """Test weather endpoint without city parameter"""
            rv = client.get('/api/weather')
            assert rv.status_code == 400
            data = rv.get_json()
            assert 'error' in data
        
        def test_serve_frontend(client):
            """Test that frontend is served"""
            rv = client.get('/')
            assert rv.status_code == 200 or rv.status_code == 404  # 404 if frontend files not found
        EOF
        
        # Set environment variable for testing
        export OPENWEATHER_API_KEY=test_key_for_ci
        
        # Run tests
        pytest tests/ -v --cov=app --cov-report=term-missing

    - name: Security scan with bandit
      run: |
        cd app/backend
        pip install bandit
        bandit -r . -f json -o bandit-report.json || true
        bandit -r . || true

  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_DEFAULT_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build Docker image
      run: |
        cd app
        docker build -t $ECR_REPOSITORY:$IMAGE_TAG .
        docker tag $ECR_REPOSITORY:$IMAGE_TAG ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:$IMAGE_TAG
        docker tag $ECR_REPOSITORY:$IMAGE_TAG ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:latest

    - name: Run container security scan
      run: |
        # Install Trivy for container scanning
        sudo apt-get update
        sudo apt-get install wget apt-transport-https gnupg lsb-release -y
        wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
        echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
        sudo apt-get update
        sudo apt-get install trivy -y
        
        # Run Trivy scan
        trivy image --exit-code 0 --severity HIGH,CRITICAL $ECR_REPOSITORY:$IMAGE_TAG

    - name: Test Docker container
      run: |
        # Start container in detached mode
        docker run -d -p 8080:8080 --name test-container -e OPENWEATHER_API_KEY=test_key $ECR_REPOSITORY:$IMAGE_TAG
        
        # Wait for container to start
        sleep 30
        
        # Test health endpoint
        curl -f http://localhost:8080/health || exit 1
        
        # Test frontend
        curl -f http://localhost:8080/ || exit 1
        
        # Stop and remove container
        docker stop test-container
        docker rm test-container

    - name: Push Docker image to ECR
      run: |
        docker push ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:$IMAGE_TAG
        docker push ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:latest

    - name: Update image tag for deployment
      run: |
        echo "IMAGE_URI=${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT
        echo "Built and pushed image: ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:$IMAGE_TAG"

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    needs: lint-and-test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Checkov (Terraform security scan)
      run: |
        pip install checkov
        checkov -d terraform/ --framework terraform || true

    - name: Run TruffleHog (secrets scan)
      run: |
        docker run --rm -v "$PWD:/pwd" trufflesecurity/trufflehog:latest github --repo https://github.com/${{ github.repository }}.git --only-verified || true

  terraform-validate:
    name: Terraform Validation
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.6.0

    - name: Terraform Format Check
      run: |
        cd terraform
        terraform fmt -check=true -diff=true

    - name: Terraform Init
      run: |
        cd terraform
        terraform init -backend=false

    - name: Terraform Validate
      run: |
        cd terraform
        terraform validate

    - name: Terraform Plan (Dry Run)
      run: |
        cd terraform
        terraform plan -var="openweather_api_key=dummy_key" -var="domain_name=" -out=tfplan || true

  notify:
    name: Notification
    runs-on: ubuntu-latest
    needs: [lint-and-test, build-and-push, security-scan, terraform-validate]
    if: always()
    
    steps:
    - name: Notify Success
      if: ${{ needs.lint-and-test.result == 'success' && needs.build-and-push.result == 'success' }}
      run: |
        echo "✅ CI Pipeline completed successfully!"
        echo "- Code linting and tests: PASSED"
        echo "- Docker build and push: PASSED"
        echo "- Security scans: COMPLETED"
        echo "- Terraform validation: PASSED"

    - name: Notify Failure
      if: ${{ needs.lint-and-test.result == 'failure' || needs.build-and-push.result == 'failure' }}
      run: |
        echo "❌ CI Pipeline failed!"
        echo "- Lint and Test: ${{ needs.lint-and-test.result }}"
        echo "- Build and Push: ${{ needs.build-and-push.result }}"
        echo "- Security Scan: ${{ needs.security-scan.result }}"
        echo "- Terraform Validate: ${{ needs.terraform-validate.result }}"
        exit 1
